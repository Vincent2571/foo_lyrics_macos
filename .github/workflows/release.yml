name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon component
        run: ./script/build_and_run.sh --verify
      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/foo_lyrics_macos.component foo_lyrics_macos-${{ github.ref_name }}-arm64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: foo_lyrics_macos-${{ github.ref_name }}-arm64.zip
          generate_release_notes: true
